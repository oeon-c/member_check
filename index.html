<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동아리 정산</title>
<link rel="stylesheet" href="./style.css">
<header><a href="#events">동아리 정산</a><span id="mode"></span></header>
<nav id="nav" hidden><a href="#events">이벤트</a><a href="#pending">미완료 정산</a><a href="#roster">학기 명단</a><a href="#settings">설정</a></nav>
<main id="app"></main>
<p id="status" role="status"></p>
<dialog id="members" aria-labelledby="member-title">
  <h2 id="member-title">참여자 선택</h2>
  <input id="search" type="search" placeholder="이름 검색" aria-label="이름 검색">
  <div id="member-list"></div>
  <footer><strong id="count"></strong><button id="done">완료</button></footer>
</dialog>
<dialog id="payment-checks" aria-labelledby="payment-title">
  <form id="payment-form">
    <h2 id="payment-title">입금 확인</h2>
    <p>입금 완료한 사람을 체크한 뒤 저장하세요. 체크한 사람은 목록 아래로 이동합니다.</p>
    <div id="payment-rows"></div>
    <footer><strong id="payment-total"></strong><button id="payment-close" class="secondary" type="button">취소</button><button>저장</button></footer>
  </form>
</dialog>
<script type="module" src="./app.js"></script>
</html>
